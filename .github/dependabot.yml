version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /infra/lambda/intake
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /infra/selfhost/intake-api
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/terraform/bootstrap
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/terraform/main
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
